name: Build and Update Docs

on:
  workflow_dispatch: # Actions 탭에서 수동 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. PAT를 주입하여 main 브랜치 체크아웃
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      # 2. Node.js 환경 설정 (Node 24 적용)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # 3. 의존성 설치 및 빌드
      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      # 4. docs 폴더 비우기 및 빌드 산출물 복사
      - name: Replace docs content
        run: |
          mkdir -p docs
          rm -rf docs/*
          cp -r dist/* docs/

      # 5. 변경 사항 확인 후 커밋 및 푸시
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs

          # 변경 사항이 있을 때만 커밋 및 푸시
          if git diff --staged --quiet; then
            echo "변경 사항이 없어 푸시를 건너뜁니다."
          else
            git commit -m "chore: rebuild docs from main [skip ci]"
            git push origin main
          fi
