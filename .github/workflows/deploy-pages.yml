name: Deploy to GitHub Pages

on:
  # main 브랜치로 푸시될 때 자동 배포
  push:
    branches:
      - main
  # Actions 탭에서 수동 실행 지원
  workflow_dispatch:

# GITHUB_TOKEN에 GitHub Pages 배포 및 OIDC 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 동일한 배포 그룹의 동시 실행 방지 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # dist 폴더를 Pages 배포용 아티팩트로 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
